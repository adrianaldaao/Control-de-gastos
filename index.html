<!doctype html>
<html lang="es" style="--inc: #82916A; --exp: #6F2E44; --semi: #B87550; --vr: #D0A34F; --debt: #79566B; --inv: #5B7FA5; --sav: #82916A;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi mes · Finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4FB;--card:#fff;--ink:#2A2540;--mute:#8B86A3;--line:#E8E4F3;--brand:#1F5F6B;--inc:#82916A;--exp:#6F2E44;--inv:#5B7FA5;--sav:#82916A;--semi:#B87550;--vr:#D0A34F;--debt:#79566B;--shadow:0 6px 18px rgba(80,60,160,.08);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142A;--card:#231F3D;--ink:#F1EEFF;--mute:#9C97B8;--line:#332E55;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17142A;--card:#231F3D;--ink:#F1EEFF;--mute:#9C97B8;--line:#332E55;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.4 Nunito,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;display:flex;justify-content:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{width:100%;max-width:480px;padding:0 16px 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
header h1{font-size:20px;font-weight:800;margin:0;text-transform:capitalize}
.arr{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:18px;font-weight:800}
.hero{background:var(--brand);color:#fff;border-radius:28px 28px 28px 10px;padding:20px;margin-top:6px}
.hero small{opacity:.85;font-weight:700}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.5px;margin:2px 0}
.hero .neg{color:#FFD3DE}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.mini{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.mini small{color:var(--mute);font-weight:700;display:flex;align-items:center;gap:6px}
.mini b{display:block;font-size:16px;font-weight:800;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.card h2{font-size:16px;font-weight:800;margin:0 0 12px}
.bar{display:flex;height:22px;border-radius:12px;overflow:hidden;background:var(--line);gap:0}
.bar i{display:block;min-width:0;cursor:pointer;transition:opacity .15s}
.chart:has(.sel) .sg:not(.sel){opacity:.4}
.sg{cursor:pointer;transition:opacity .15s}
.yk{display:grid;grid-template-columns:.8fr 1fr 1fr 1fr 1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;text-align:right;cursor:pointer;width:100%}
.yk>:first-child{text-align:left}
.yk.h{color:var(--mute);font-size:11px;font-weight:800;cursor:default}
.yk.t{border:0;font-weight:800;cursor:default}
.bi{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px;font:700 12.5px Nunito,system-ui,sans-serif;text-align:right}
.crow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-weight:700}
.crow input{width:44px;height:30px;border:0;background:none;padding:0}
.f2{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-weight:700}
.segtip{margin-top:10px;font-size:13px;font-weight:700;color:var(--mute);min-height:20px}
.segtip b{color:var(--ink)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;color:var(--mute);font-weight:700;font-size:13px}
.leg span{display:flex;align-items:center;gap:6px}
.donutwrap{display:flex;gap:14px;align-items:center}
.donut{width:130px;height:130px;flex:none}
.donut text{fill:var(--ink);font-weight:800;font-size:15px;text-anchor:middle}
.donut .s{fill:var(--mute);font-size:9px;font-weight:700}
.cl{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.cl div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.cl em{font-style:normal;margin-left:auto;font-weight:800}
.cl span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:800}
.row .t small{color:var(--mute);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-weight:700}
.empty big{display:block;font-size:34px;margin-bottom:6px}
.total{display:flex;justify-content:space-between;align-items:flex-end}
.total b{font-size:30px;font-weight:800;letter-spacing:-.5px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
nav div{width:100%;max-width:456px;background:var(--card);border-radius:26px;box-shadow:0 8px 30px rgba(60,40,140,.18);display:flex;padding:6px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:18px;font-size:10px;line-height:1.1;text-align:center;font-weight:800;color:var(--mute)}
nav button span{font-size:18px}
nav button.on{background:var(--brand);color:#fff}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px 20px 8px 20px;background:var(--brand);color:#fff;font-size:30px;font-weight:800;box-shadow:0 8px 20px rgba(31,95,107,.45);z-index:7}
.ov{position:fixed;inset:0;background:rgba(20,10,50,.45);z-index:20}
.sh{position:fixed;left:0;right:0;bottom:0;margin:auto;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:21;max-height:92%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sh{animation:none}}
.seg{display:flex;background:var(--bg);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 0;border-radius:12px;font-weight:800;font-size:12px;color:var(--mute)}
.seg button.on{color:#fff}
.amtin{width:100%;border:0;background:none;font:800 42px Nunito,system-ui,sans-serif;color:var(--ink);text-align:center;margin:14px 0 4px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{padding:8px 12px;border-radius:14px;background:var(--bg);font-weight:700;font-size:14px;border:2px solid transparent}
.chip.on{border-color:var(--brand);background:var(--card)}
.f{display:flex;gap:10px}
.f input{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 12px;font:600 15px Nunito,system-ui,sans-serif;margin-bottom:12px}
.save{width:100%;padding:15px;border-radius:18px;background:var(--brand);color:#fff;font-weight:800;font-size:16px}
.del{width:100%;padding:12px;color:var(--exp);font-weight:800}
.foot{text-align:center;color:var(--mute);font-size:12px;font-weight:700;margin-top:18px}
.foot button{color:var(--mute);text-decoration:underline;font-weight:700}
.cp{width:100%;padding:12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:800;color:var(--brand)}
.blk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700}
.blk:last-child{border:0}
.blk b{margin-left:auto;font-weight:800}
.chip.new{border:2px dashed var(--line);color:var(--mute)}
.row{cursor:pointer}
.pd{font-size:11px;font-weight:800;padding:4px 8px;border-radius:10px;background:var(--line);color:var(--mute);flex:none}
.pd.ok{background:color-mix(in srgb,var(--inc) 20%,transparent);color:var(--inc)}
.lbl{font-size:12px;font-weight:800;color:var(--mute);margin:2px 0}
.bk{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;text-align:right}
.bk>:first-child{text-align:left}
.bk.h{color:var(--mute);font-size:11px;font-weight:800}
.bk.t{border:0;font-weight:800}
.pbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.note{border-radius:20px;padding:14px;margin:12px 0;font-weight:600;line-height:1.45}
.acc{margin:12px 0}
.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);font-weight:800;cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"›";font-size:20px;transition:transform .2s}
.acc[open]>summary::after{transform:rotate(90deg)}
.acc>summary b{margin-left:auto}
.lg{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:12px;background:var(--bg);border:2px solid transparent;font-weight:800;font-size:13px;color:var(--ink);transition:opacity .15s}
.lg.off{opacity:.4;color:var(--mute)}
.lg.off .dot{background:var(--mute)!important}
.cin{width:38px;height:32px;border:0;background:none;padding:0;flex:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sh::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh{touch-action:pan-y;overscroll-behavior:contain}
</style>

<body>
<div id="app"></div>
<div id="sheet"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a&&!a.innerHTML.trim())a.innerHTML='<div style="padding:24px;font:600 15px system-ui;color:#c0392b">⚠️ Error al iniciar la app:<br><small>'+String(e.message).replace(/</g,'&lt;')+'</small><br><br><small>Recarga la página. Si persiste, avísame con este mensaje.</small></div>'});
// Estado de Firebase: debe declararse antes del primer render() (la cabecera lee FB_USER al pintarse)
let FIXED_N=0;
let FB_USER=null,FB_DB=null,FB_AUTH=null,FB_UNSUB=null,FB_ST='off',FB_MSG='',FB_MODE='login',FB_TMR=null,FB_IGNORE=false;
const DEF={
 income:[['Nómina','💼'],['Extra','✨'],['Regalo','🎁'],['Otros','💰']],
 fixed:[['Alquiler','🏠'],['Gimnasio','🏋️'],['Peluquería','💈'],['Spotify','🎧'],['Parking','🅿️']],
 semi:[['Supermercado','🛒'],['Hogar','🧺'],['Gasolina','⛽'],['Gato','🐱'],['Pádel','🎾']],
 var:[['Ocio','🎬'],['Compras','🛍️'],['Viajes','✈️'],['Otros','🧾']],
 debt:[['Coche','🚗'],['Préstamo','🏦'],['Tarjeta','💳'],['Otras deudas','🧾']],
 invest:[['MSCI','📈'],['Vanguard','📊'],['Otras inversiones','💎']]
};
let CATS=JSON.parse(JSON.stringify(DEF));
const T_DEF={
 income:{n:'Ingresos',s:'Ingreso',c:'var(--inc)',Def:'#82916A',v:'--inc',g:'inc',sg:'+',d:'Nóminas y otros ingresos del mes.'},
 fixed:{n:'Gastos fijos',s:'Fijo',c:'var(--exp)',Def:'#6F2E44',v:'--exp',g:'exp',sg:'−',d:'Los de todos los meses, siempre del mismo importe.'},
 semi:{n:'Gastos semifijos',s:'Semifijo',c:'var(--semi)',Def:'#B87550',v:'--semi',g:'exp',sg:'−',d:'Cada mes, pero con importe variable.'},
 var:{n:'Gastos variables',s:'Variable',c:'var(--vr)',Def:'#D0A34F',v:'--vr',g:'exp',sg:'−',d:'Todo lo que no entra en fijos ni semifijos.'},
 debt:{n:'Deudas',s:'Deuda',c:'var(--debt)',Def:'#79566B',v:'--debt',g:'exp',sg:'−',d:'Cuotas y devoluciones de deudas por concepto.'},
 invest:{n:'Inversiones',s:'Inversión',c:'var(--inv)',Def:'#5B7FA5',v:'--inv',g:'inv',sg:'−',d:'Cuenta como salida: se resta de tus ingresos para calcular el ahorro.'}
};
let T=JSON.parse(JSON.stringify(T_DEF)),SAV_META={n:'Ahorro',Def:'#82916A'};
const typesOf=g=>Object.keys(T).filter(k=>T[k].g===g);
const allTypes=()=>[...typesOf('inc'),...typesOf('exp'),...typesOf('inv'),...typesOf('sav')];
const outTypes=()=>[...typesOf('exp'),...typesOf('inv'),...typesOf('sav')];
let BANKS=[],MODES=[];
const pc=(a,b)=>b>0?Math.round(a/b*100)+'%':'–';
const pct1=(a,b)=>b>0?(Math.round(a/b*1000)/10).toLocaleString('es-ES')+'%':'–';
const PAL=['#7C5CFC','#FF6F91','#FFB938','#2FBF9B','#4DA3FF','#FF8A5B','#B38CFF','#4FC3D9','#9CCB5A','#A0A0B8'];
const NAV=[['resumen','🌤️','Resumen'],['income','💵','Ingresos'],['gastos','🛒','Gastos'],['bud','🎯','Presupuestos'],['ahorro','📈','Ahorro e inversiones']];
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const now=new Date();
let S={tx:[]},V={y:now.getFullYear(),m:now.getMonth(),tab:'resumen',vis:{i:true,e:true,v:true,a:true}},M=null;
function syncTypes(){
 T=JSON.parse(JSON.stringify(T_DEF));
 if(S.tmeta){for(const [k,v] of Object.entries(S.tmeta)){if(T[k])Object.assign(T[k],v);else T[k]=v}}
 SAV_META=Object.assign({n:'Ahorro',Def:'#82916A'},S.savMeta||{});
 for(const k of Object.keys(T)){if(!CATS[k]||!CATS[k].length)CATS[k]=DEF[k]?JSON.parse(JSON.stringify(DEF[k])):[['General','🏷️']]}
}
function fixup(){
 syncTypes();
 S.tx=Array.isArray(S.tx)?S.tx:[];
 S.tx.forEach(t=>{
  if(t.type==='var'&&t.cat==='Traspaso'&&t.bank2){t.type='transfer';FIXED_N++}   // repara traspasos convertidos por error en gasto variable
  if(t.type!=='transfer'&&!T[t.type])t.type='var';
  if(t.type==='expense')t.type='var';
  if(t.bank==='Efectivo'){t.bank='';if(!t.mode)t.mode='Efectivo'}
  if(t.mode==='Efectivo')t.bank='';
  if(t.type==='invest'){if(t.cat==='ETF 1')t.cat='MSCI';if(t.cat==='ETF 2')t.cat='Vanguard'}
 });
 S.rec=Array.isArray(S.rec)?S.rec:[];
 S.rec.forEach(r=>{if(!T[r.type])r.type='fixed';if(r.bank==='Efectivo'){r.bank='';if(!r.mode)r.mode='Efectivo'}if(r.mode==='Efectivo')r.bank=''});
 CATS.invest=CATS.invest.map(c=>c[0]==='ETF 1'?['MSCI',c[1]]:c[0]==='ETF 2'?['Vanguard',c[1]]:c);
 syncLists();
}
try{const r=localStorage.getItem('mimes_v1');if(r){S=JSON.parse(r);if(S.cats)CATS=S.cats}}catch(e){}
S=Object.assign({tx:[],rec:[],pots:[]},S);
fixup();if(FIXED_N){FIXED_N=0;save()}
function save(){S.cats=CATS;S.updatedAt=Date.now();try{localStorage.setItem('mimes_v1',JSON.stringify(S))}catch(e){}if(typeof scheduleFbPush==='function')scheduleFbPush()}
const key=()=>V.y+'-'+String(V.m+1).padStart(2,'0');
const mtx=()=>S.tx.filter(t=>t.date.slice(0,7)===key()).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const sum=(l,ty)=>l.filter(t=>t.type===ty).reduce((a,t)=>a+t.amount,0);
const fd=d=>new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const icon=(ty,c)=>{const list=CATS[ty]||[];const i=list.findIndex(x=>x[0]===c);return i<0?'🧾':list[i][1]};
function move(d){V.m+=d;if(V.m<0){V.m=11;V.y--}if(V.m>11){V.m=0;V.y++}render()}
function go(t){V.tab=t;V.mode='month';render();scrollTo(0,0)}

function rowH(t){
 const c=T[t.type].c;
 const isInc=T[t.type]&&T[t.type].g==='inc',s=isInc===(t.amount>=0)?'+':'−',pd=['fixed','debt'].includes(t.type)?`<span class="pd ${t.paid?'ok':''}" onclick="event.stopPropagation();togglePaid(${t.id})">${t.paid?'✓ Pagado':'Pendiente'}</span>`:'';
 return `<div class="row" role="button" tabindex="0" onclick="openSheet('${t.type}',${t.id})"><span class="ico" style="background:color-mix(in srgb,${c} 18%,transparent)">${icon(t.type,t.cat)}</span><span class="t"><b>${esc(t.cat)}</b><small>${fd(t.date)}${t.bank?' · '+esc(t.bank):''}${t.mode?' · '+esc(t.mode):''}${t.note?' · '+esc(t.note):''}</small></span>${pd}<span class="amt" style="color:${c}">${s}${eur(Math.abs(t.amount))}</span></div>`;
}
function donut(items,total,label){
 const R=52,C=2*Math.PI*R;let off=0;
 const arcs=items.map(i=>{const l=i.v/total*C;const s=`<circle r="${R}" cx="70" cy="70" fill="none" style="stroke:${i.c}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;return s}).join('');
 return `<svg viewBox="0 0 140 140" class="donut"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="20"/>${arcs}<text x="70" y="68">${eur(total).replace(/\s/g,'')}</text><text class="s" x="70" y="84">${label}</text></svg>`;
}
function byCat(l,ty){
 const m={};l.filter(t=>t.type===ty).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);
 return Object.entries(m).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n,v,c:(S.colors||{})['c:'+ty+':'+n]||PAL[Math.max(0,CATS[ty].findIndex(x=>x[0]===n))%PAL.length],e:icon(ty,n)}));
}
const sumG=(l,g)=>typesOf(g).reduce((a,k)=>a+sum(l,k),0);
function resumen(l){
 const inc=sumG(l,'inc'),exp=sumG(l,'exp'),inv=sumG(l,'inv'),sav=ah(l);
 const pct=inc>0?Math.round(sav/inc*100):0;
 const outK=[...typesOf('exp'),...typesOf('inv'),...typesOf('sav')];

function resolveAmt(el){
 const v=el.value.trim();
 if(!v)return;
 if(v[0]==='='||/[+\-*/()]/.test(v.slice(1))){
  const expr=v[0]==='='?v.slice(1):v;
  const r=calc(expr);
  if(!isNaN(r)){el.value=f2(r)}
  else{el.value='';el.placeholder='Operación no válida'}
 }
 if(M&&el.id==='amt')M.amount=el.value;
 if(R&&el.id==='ra')R.amount=el.value;
}
function amtKey(e,el){

  e.preventDefault();
  resolveAmt(el);
  el.blur();
 }
}
(function(){
 let sy=0,dy=0,sh=null,active=false;
 document.addEventListener('touchstart',e=>{
  const el=e.target.closest('.sh');
  if(!el)return;
  if(el.scrollTop>5)return;
  sh=el;
  sy=e.touches[0].clientY;
  dy=0;
  active=true;
  sh.style.transition='none';
 },{passive:true});
 document.addEventListener('touchmove',e=>{
  if(!active||!sh)return;
  dy=e.touches[0].clientY-sy;
  if(dy>0&&sh.scrollTop<=0){
   if(e.cancelable)e.preventDefault();
   sh.style.transform='translateY('+dy+'px)';
  }else if(dy<-8){
   active=false;
   sh.style.transform='';
  }
 },{passive:false});
 document.addEventListener('touchend',()=>{
  if(!active||!sh)return;
  active=false;
  const el=sh;
  sh=null;
  el.style.transition='transform .22s ease-out';
  if(dy>70){
   el.style.transform='translateY(100%)';
   setTimeout(()=>{closeSheet();render()},180);
  }else{
   el.style.transform='';
  }
 },{passive:true});
})();

function initFirebaseApp(){
 try{
  if(typeof firebase==='undefined')return;
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  FB_AUTH=firebase.auth();
  FB_DB=firebase.firestore();
  FB_AUTH.onAuthStateChanged(user=>{
   FB_USER=user;
   if(FB_UNSUB){FB_UNSUB();FB_UNSUB=null}
   if(user){
    FB_ST='sync';updCloudBtn();
    const docRef=FB_DB.collection('users').doc(user.uid);
    FB_UNSUB=docRef.onSnapshot(snap=>{
     if(FB_IGNORE)return;
     if(snap.exists){
      const d=snap.data();
      if(d&&d.payload){
       try{
        const remoteS=JSON.parse(d.payload);
        const rTime=remoteS.updatedAt||0,lTime=S.updatedAt||0;
        if(rTime>=lTime||!S.tx.length){
         S=Object.assign({tx:[],rec:[],pots:[]},remoteS);
         CATS=S.cats?JSON.parse(JSON.stringify(S.cats)):JSON.parse(JSON.stringify(DEF));
         fixup();if(FIXED_N){FIXED_N=0;save()}
         try{localStorage.setItem('mimes_v1',JSON.stringify(S))}catch(e){}
         render();
        }else if(lTime>rTime){
         pushToFirebase(false);
        }
       }catch(e){}
      }
      FB_ST='ok';updCloudBtn();
      if(SM==='cloud')drawSet();
     }else{
      pushToFirebase(false);
     }
    },err=>{
     FB_ST='err';updCloudBtn();
    });
   }else{
    FB_ST='off';updCloudBtn();
    if(SM==='cloud')drawSet();
   }
  });
 }catch(e){}
}

 if(c.includes('weak-password'))return 'La contraseña debe tener al menos 6 caracteres.';
 if(c.includes('too-many-requests'))return 'Demasiados intentos. Espera unos segundos e inténtalo de nuevo.';
 return 'Error de conexión ('+(err&&err.message||'inténtalo de nuevo')+').';
}

async function submitFbAuth(){
 const em=($('#fb-em')||{}).value?.trim()||'';
 const pw=($('#fb-pw')||{}).value||'';
 if(!em||!pw){FB_MSG='⚠️ Escribe tu correo electrónico y contraseña.';drawSet();return}
 FB_MSG='⏳ Conectando de forma segura...';drawSet();
 try{
  if(FB_MODE==='reg'){
   await FB_AUTH.createUserWithEmailAndPassword(em,pw);
   FB_MSG='✓ Cuenta creada y sincronizada con éxito.';
  }else{
   await FB_AUTH.signInWithEmailAndPassword(em,pw);
   FB_MSG='✓ Sesión iniciada correctamente.';
  }
  drawSet();
 }catch(err){
  FB_MSG='⚠️ '+fbErrText(err);
  drawSet();
 }
}

async function resetFbPwd(){
 const em=($('#fb-em')||{}).value?.trim()||'';
 if(!em){FB_MSG='⚠️ Escribe primero tu correo en la casilla de arriba para enviarte el enlace.';drawSet();return}
 try{
  await FB_AUTH.sendPasswordResetEmail(em);
  FB_MSG='📩 Te hemos enviado un correo para restablecer tu contraseña. Revisa tu bandeja de entrada o spam.';
 }catch(err){
  FB_MSG='⚠️ '+fbErrText(err);
 }
 drawSet();
}

async function signOutFb(clearLocal){
 if(FB_UNSUB){FB_UNSUB();FB_UNSUB=null}
 if(FB_AUTH)await FB_AUTH.signOut();
 if(clearLocal){
  localStorage.removeItem('mimes_v1');
  S={tx:[],rec:[],pots:[]};CATS=JSON.parse(JSON.stringify(DEF));fixup();
 }
 FB_MSG='Sesión cerrada correctamente.';
 render();drawSet();
}

 if(FB_USER){

   <div class="f2"><div><small style="color:var(--mute);font-weight:700">SESIÓN INICIADA COMO</small><br><b style="font-size:15px">🟢 ${esc(FB_USER.email)}</b></div></div>
   <small style="color:var(--mute);font-weight:600;display:block;margin-top:6px">Tus movimientos, categorías y presupuestos se guardan automáticamente y en tiempo real en tu nube privada de Google.</small>
  </div>
  ${FB_MSG?`<div class="note" style="background:var(--bg);margin:10px 0;font-size:13px">${esc(FB_MSG)}</div>`:''}
  <button class="save" onclick="pushToFirebase(true)">🔄 Sincronizar ahora</button>
  <button class="cp" style="margin-top:10px" onclick="signOutFb(false)">Cerrar sesión (mantener datos en este móvil)</button>
  <button class="del" onclick="signOutFb(true)">Cerrar sesión y limpiar datos de este dispositivo</button>`;
 }
 return `<small style="color:var(--mute);font-weight:600;display:block;margin-bottom:10px">Inicia sesión o crea una cuenta gratuita para que tus datos nunca se pierdan si cambias de móvil o borras el navegador, y para sincronizar varios dispositivos en tiempo real.</small>
 <div class="seg" style="margin-bottom:12px">
  <button class="${FB_MODE==='login'?'on':''}" ${FB_MODE==='login'?'style="background:var(--brand)"':''} onclick="FB_MODE='login';FB_MSG='';drawSet()">Iniciar sesión</button>
  <button class="${FB_MODE==='reg'?'on':''}" ${FB_MODE==='reg'?'style="background:var(--brand)"':''} onclick="FB_MODE='reg';FB_MSG='';drawSet()">Crear cuenta</button>
 </div>
 ${FB_MSG?`<div class="note" style="background:var(--bg);margin:10px 0;font-size:13px">${esc(FB_MSG)}</div>`:''}
 <div class="lbl">Correo electrónico</div>
 <div class="f"><input id="fb-em" type="email" inputmode="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" style="margin-bottom:8px"></div>
 <div class="lbl">Contraseña ${FB_MODE==='reg'?'(mínimo 6 caracteres)':''}</div>
 <div class="f"><input id="fb-pw" type="password" autocomplete="${FB_MODE==='reg'?'new-password':'current-password'}" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitFbAuth()" style="margin-bottom:10px"></div>
 <button class="save" onclick="submitFbAuth()">${FB_MODE==='reg'?'✨ Crear mi cuenta y respaldar datos':'🔑 Entrar y sincronizar'}</button>
 ${FB_MODE==='login'?`<button class="del" style="color:var(--mute);margin-top:6px" onclick="resetFbPwd()">¿Has olvidado tu contraseña?</button>`:''}`;
}

initFirebaseApp();
</script>
